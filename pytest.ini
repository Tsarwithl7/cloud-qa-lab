[pytest]
addopts = -ra -v
pythonpath = .
testpaths = tests
markers =
    slow: slower tests (quota loops, long polls); exclude in fast runs with -m "not slow"
    smoke: minimal post-deploy sanity checks
    compute: cloud host (Nova) tests
    storage: cloud volume (Cinder) tests
    network: cloud network (Neutron) tests
    baremetal: bare-metal (Ironic) tests
